<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Chat</title>
<style>
  #loading span {
    display: inline-block; overflow: hidden; vertical-align: bottom;
    width: 0; animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { to { width: 1em; } }
</style>

<h1>Sandbox interface demo</h1>

<h2>Browser stream</h2>
<button type="button" id="open-tab">Open Google in a new tab</button>
<!-- Shared browser stream URI; keep unchanged. Shows the active tab.
     cast=1 is watch-only; mute_chat=1 disables chat sounds. -->
<iframe src="/web-browser-webrtc/?cast=1&mute_chat=1"
  width="640" height="480"></iframe>
<hr>

<h2>File access</h2>
<!-- File preview uses /file-browser/ and ?mode=preview; keep these unchanged.
     folder-1/picture.png is a mock path: use one that exists. -->
<p>Example file: /worktrees/folder-1/picture.png</p>
<a href="/file-browser/folder-1/picture.png?mode=preview"
  target="_blank">Open file preview</a>
<button type="button" id="fetch-file">Fetch image content</button>
<div><img id="fetched-image" width="320" hidden></div>
<hr>

<h2>Agent chat</h2>
<label>Agent <select id="profile"></select></label>
<label>Session <select id="session"></select></label>
<button id="new">New chat</button>
<ul id="log"></ul>
<p id="loading" hidden>Working<span>...</span></p>
<h3>Send a message or attach a file</h3>
<form id="form">
  <input id="file" type="file">
  <textarea id="text" rows="3" cols="60"></textarea>
  <button>Send</button>
</form>

<script>
// Hermes API key configured for this sandbox; keep it unchanged.
// Central gateway verifies the visitor's JWT uid matches the sandbox owner.
const KEY = 'hermes-api-server-key';
const $ = (id) => document.getElementById(id);
let sessionId = null;

// Shared browser API (uses Chrome DevTools Protocol underneath).
// Base URI: /web-browser/api; keep it unchanged. POST bodies are JSON.

// GET  /config                -> {streamUrl}
// Returns the video player's URL; resolve relative URLs against /web-browser/.

// GET  /stream-status         -> {streaming, error?}
// Checks whether the video service responds; it does not test playback.

// GET  /tabs                  -> [{id, title, url, faviconUrl, type, visible}]
// Lists browser tabs; visible identifies the tab currently shown.

// POST /new-tab               {url, colorScheme, language} -> {status, id}
// Opens a URL in a new tab; switch-tab brings it into view.

// POST /switch-tab/<id>       -> {status}; activates the tab shown in the stream

// POST /close-tab/<id>        -> {status}
// Closes the selected tab.

// POST /back[/<id>]           -> {status}
// POST /forward[/<id>]        -> {status}
// POST /reload[/<id>]         -> {status}
// back/forward navigate the tab's history; reload refreshes its current page.

// POST /type[/<id>]           {text} -> {status}
// Inserts text into the tab's focused input; without <id>, uses the visible tab.

// POST /key[/<id>]            {key} -> {status}
// Sends a key press and release, e.g. {key: 'Enter'} to submit a focused form.

// Omitted IDs use CDP's default page target, except /type uses the visible tab.
// /new-tab colorScheme: light or dark; language is optional (defaults to en-US).
// Keys: Enter, Tab, Backspace, Escape, ArrowLeft/Up/Right/Down.
// <id> comes from /tabs or /new-tab; brackets mean an optional path segment.
// Errors: HTTP 500 {error}; unsupported key: HTTP 400 {error}.

// https://www.google.com is an example destination; replace it as needed.
$('open-tab').onclick = async () => {
  try {
    const { id } = await getJson('/web-browser/api/new-tab', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: 'https://www.google.com', colorScheme: 'light' })
    });
    await getJson(`/web-browser/api/switch-tab/${id}`, { method: 'POST' });
  } catch (err) {
    show('error', err.message);
  }
};

// File API base URI: /file-api/api; keep it unchanged. POST bodies are JSON,
// except /upload (multipart). Paths omit /worktrees; encode query values.

// GET    /files?dir=...&page=1&sortBy=name&sortOrder=asc
// Lists a directory. dir=/ lists /worktrees; page numbers start at 1.
//        -> {items: [{name, path, isDir, size, mtime, ext}], pagination:
//            {page, limit, totalItems, totalPages}}
//        sortBy: name/size/ext/mtime; sortOrder: asc/desc.

// GET    /file/content?path=... -> file bytes; use for text, images or media.
// Supports Range headers for partial downloads and media seeking.

// PUT    /file/content?path=... -> {message}; creates or replaces file content.
// Send raw text/bytes with the file's Content-Type, not a JSON wrapper.

// POST   /folders       {dir, name} -> {message}
// Creates a folder: {dir: '/', name: 'uploads'} creates /worktrees/uploads.

// POST   /upload?dir=... multipart field "file" -> {message, file: {filename, path, size}}
// Uploads into an existing directory, keeping the filename and replacing matches.
// Use FormData; the browser sets its multipart Content-Type and boundary.

// Failures use non-2xx HTTP status codes with {error}.

// /folder-1/picture.png is a mock path: use one that exists.
$('fetch-file').onclick = async () => {
  try {
    const path = encodeURIComponent('/folder-1/picture.png');
    const response = await fetch(`/file-api/api/file/content?path=${path}`);
    if (!response.ok) throw new Error(await response.text());
    const image = $('fetched-image');
    if (!image.hidden) URL.revokeObjectURL(image.src);
    image.src = URL.createObjectURL(await response.blob());
    image.hidden = false;
  } catch (err) {
    show('error', err.message);
  }
};

// Hermes API gateway prefix: /openai-endpoint; keep it unchanged.
// 'default' is the default profile ID; other IDs come from /mgr/api/v1/agents.
// Add /p/<id> for non-default profiles.
function hermes(path) {
  const profile = $('profile').value;
  if (profile === 'default') {
    return '/openai-endpoint' + path;
  } else {
    return `/openai-endpoint/p/${profile}` + path;
  }
}

async function getJson(url, options = {}) {
  options.headers = { Authorization: `Bearer ${KEY}`, ...options.headers };
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

function show(who, text) {
  const div = document.createElement('li');
  const role = document.createElement('b');
  role.textContent = `${who}: `;
  div.append(role, document.createTextNode(text));
  $('log').appendChild(div);
  return div;
}

// GET /mgr/api/v1/agents lists agent profiles -> {agents: [{id, display_name}]}.
// Keep the endpoint unchanged; use id in URLs and display_name as the label.
async function loadProfiles() {
  const { agents } = await getJson('/mgr/api/v1/agents');
  for (const a of agents) $('profile').add(new Option(a.display_name || a.id, a.id));
}

// Hermes session list endpoint; keep /api/sessions?source=api_server unchanged.
// Lists API chats -> {data: [{id, title, preview}]}; excludes IM platform sessions.
async function loadSessions() {
  const { data } = await getJson(hermes('/api/sessions?source=api_server'));
  $('session').innerHTML = '<option value="">(new chat)</option>';
  for (const s of data) $('session').add(new Option(s.title || s.preview || s.id, s.id));
  $('session').value = sessionId || '';
}

// /api/sessions/<id>/messages -> {data: [{role, content, tool_calls}]}.
// Reads saved chat history. Keep endpoint unchanged; use that profile's session ID.
async function openSession(id) {
  sessionId = id || null;
  $('log').innerHTML = '';
  if (!sessionId) return;
  const { data } = await getJson(hermes(`/api/sessions/${sessionId}/messages`));
  for (const m of data) {
    if (m.role === 'user' || m.role === 'assistant') {
      if (typeof m.content === 'string' && m.content) show(m.role, m.content);
      for (const call of m.tool_calls || []) show('tool', call.function.name);
    }
  }
}

// Keep /file-api/api/folders and /file-api/api/upload unchanged.
// /uploads is this demo's upload destination; change it if needed.
async function upload(file) {
  // The folder API reports an error if it already exists; this demo ignores it.
  await fetch('/file-api/api/folders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dir: '/', name: 'uploads' })
  });
  const body = new FormData();
  body.append('file', file);
  const { file: saved } = await getJson('/file-api/api/upload?dir=/uploads/', { method: 'POST', body });
  // /worktrees is where the agent sees File API paths.
  return `/worktrees${saved.path}`;
}

// POST /api/sessions/<id>/chat/stream sends {message} and streams the reply.
// Keep the endpoint and these SSE event names unchanged:
// assistant.delta {delta}: append reply text; tool.started {tool_name}: tool call.
// assistant.completed {content}: final reply text; error {message}: turn failure.
async function send(text) {
  if (!sessionId) {
    // POST /api/sessions with {} creates a chat -> {session: {id}}; keep URI unchanged.
    const { session } = await getJson(hermes('/api/sessions'), { method: 'POST', body: '{}' });
    sessionId = session.id;
  }
  show('user', text);
  const res = await fetch(hermes(`/api/sessions/${sessionId}/chat/stream`), {
    method: 'POST',
    headers: { Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);

  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = '';
  let answer = '';
  let reply = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += value;
    const frames = buffer.split('\n\n');
    buffer = frames.pop();
    for (const frame of frames) {
      const event = frame.match(/^event: (.*)$/m)?.[1];
      const data = frame.match(/^data: (.*)$/m)?.[1];
      if (!data) continue;
      const payload = JSON.parse(data);
      if (event === 'assistant.delta') answer += payload.delta;
      if (event === 'tool.started') {
        show('tool', payload.tool_name);
        answer = '';
        reply = null;
      }
      if (event === 'assistant.completed') answer = payload.content || answer;
      if (event === 'error') show('error', payload.message);
      if (answer) {
        reply ??= show('assistant', '');
        reply.lastChild.textContent = answer;
      }
    }
  }
  await loadSessions();
}

$('form').onsubmit = async (event) => {
  event.preventDefault();
  let text = $('text').value.trim();
  const file = $('file').files[0];
  $('text').value = '';
  $('file').value = '';
  $('loading').hidden = false;
  const button = $('form').querySelector('button');
  button.disabled = true;
  try {
    if (file) text += `\nAttached file: ${await upload(file)}`;
    if (text.trim()) await send(text.trim());
  } catch (err) {
    show('error', err.message);
  } finally {
    $('loading').hidden = true;
    button.disabled = false;
  }
};
$('profile').onchange = () => openSession(null).then(loadSessions);
$('session').onchange = () => openSession($('session').value);
$('new').onclick = () => openSession(null).then(loadSessions);

loadProfiles().then(loadSessions).catch((err) => show('error', err.message));
</script>
