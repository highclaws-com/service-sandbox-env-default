[program:hermes-gateway]
; Every `hermes gateway restart` stops the gateway; `--external-supervisor`
; on the command below decides who owned the start of the new one:
;   without it: the restart CLI owned the start.
;   with it:    supervisord owned the start.
command=hermes gateway run --external-supervisor
directory=/worktrees
user=agent
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/agent"
