[program:reverse-ssh]
; Restart sshd if the keys are not ready on first boot.
command=/usr/sbin/sshd -D -e -f /etc/supervisor/reverse_ssh/sshd_config
user=root
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
