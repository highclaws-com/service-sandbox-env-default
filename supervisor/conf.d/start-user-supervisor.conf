[program:user-supervisor]
; Core Supervisor
; |-- Hermes
; |-- Crew agents (failures do not affect Hermes)
; `-- retry shell (the while loop below; failures do not affect Hermes)
;     `-- User Supervisor
;         `-- Agent services
command=/bin/sh -c 'while true; do /usr/bin/supervisord -c /etc/supervisor/user-supervisord.conf; sleep 5; done'
user=agent
startsecs=0
stopasgroup=true
killasgroup=true
environment=HOME="/home/agent"
