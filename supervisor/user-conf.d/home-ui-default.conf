; Default sandbox home page, seeded as a user service on fresh provision.
; Once seeded, feel free to modify it; it may differ from this original.
[program:home-ui-default]
directory=/home/agent/home-ui-default
command=python3 server.py
user=agent
autostart=true
autorestart=false
stopasgroup=true
killasgroup=true
stdout_logfile=/home/agent/.supervisor/home-ui-default.out.log
stderr_logfile=/home/agent/.supervisor/home-ui-default.err.log
