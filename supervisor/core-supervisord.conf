; Core Supervisor (PID 1). Loads trusted program definitions from
; /etc/supervisor/conf.d/*.conf, including hermes.conf and
; start-user-supervisor.conf.
[unix_http_server]
file=/run/core-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/core-supervisor.sock

[include]
files=/etc/supervisor/conf.d/*.conf
