; User Supervisor. Loads Agent-managed program definitions from
; /home/agent/.supervisor/conf.d/*.conf.
[unix_http_server]
file=/tmp/user-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/home/agent/.supervisor/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/user-supervisord.pid
childlogdir=/home/agent/.supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/user-supervisor.sock

[include]
files=/home/agent/.supervisor/conf.d/*.conf
